<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tantra Sadhana</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #08080a;
      color: #e5e5e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 1.25rem;
      overflow-x: hidden;
    }
    header { text-align: center; }
    h1 { font-size: 1.25rem; font-weight: 300; letter-spacing: 0.25em; text-transform: uppercase; color: #a1a1aa; }
    
    /* Preset Selector */
    .preset-bar {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.75rem;
      background: #121215;
      padding: 0.25rem;
      border-radius: 999px;
      border: 1px solid #27272a;
    }
    .preset-btn {
      background: transparent;
      border: none;
      color: #71717a;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .preset-btn.active {
      background: #27272a;
      color: #fafafa;
    }

    .phase-badge {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      background: #18181b;
      color: #a1a1aa;
      border: 1px solid #27272a;
    }

    /* Spine & Visual Focus */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 320px;
      margin: 1rem 0;
      position: relative;
    }
    .orb-container {
      width: 170px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .pulse-orb {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.45) 0%, rgba(0, 0, 0, 0) 70%);
      transition: transform 4s cubic-bezier(0.4, 0, 0.2, 1), background 1.5s ease;
      filter: blur(8px);
    }
    .mantra-display {
      position: absolute;
      font-size: 2.2rem;
      font-weight: 200;
      letter-spacing: 0.15em;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }
    .focus-text {
      margin-top: 1.25rem;
      font-size: 1rem;
      letter-spacing: 0.05em;
      color: #d4d4d8;
      text-align: center;
      min-height: 1.5rem;
    }
    .instruction-text {
      font-size: 0.85rem;
      color: #71717a;
      text-align: center;
      margin-top: 0.35rem;
      min-height: 1.2rem;
    }

    /* Timers & Controls */
    .timer-readout {
      font-family: monospace;
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: #e4e4e7;
      margin-bottom: 0.8rem;
    }
    .action-btn {
      width: 100%;
      max-width: 260px;
      padding: 0.9rem;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 999px;
      color: #fafafa;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:active { transform: scale(0.98); background: #3f3f46; }
    .toggle-row {
      display: flex;
      gap: 1.2rem;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #71717a;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tantra Sadhana</h1>
    <div class="preset-bar" id="presetBar">
      <button class="preset-btn active" data-preset="60">60m Full</button>
      <button class="preset-btn" data-preset="30">30m</button>
      <button class="preset-btn" data-preset="15">15m</button>
      <button class="preset-btn" data-preset="2">2m Demo</button>
    </div>
    <div>
      <span class="phase-badge" id="phaseBadge">Preparation</span>
    </div>
  </header>

  <div class="center-stage">
    <div class="orb-container">
      <div class="pulse-orb" id="orb"></div>
      <div class="mantra-display" id="mantraText">LAM</div>
    </div>
    <div class="focus-text" id="focusText">Feet flat, hands resting on thighs</div>
    <div class="instruction-text" id="subText">Press Begin to start the sadhana</div>
  </div>

  <div style="display:flex; flex-direction:column; align-items:center; width: 100%;">
    <div class="timer-readout" id="timer">60:00</div>
    <button class="action-btn" id="startBtn">BEGIN SADHANA</button>
    <div class="toggle-row">
      <label><input type="checkbox" id="droneToggle" checked> 432Hz Drone</label>
      <label><input type="checkbox" id="hapticToggle" checked> Haptics</label>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    // Audio Engine: Tibetan Bowl & Drone via Web Audio API
    let audioCtx = null;
    let droneOsc = null;
    let droneGain = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSingingBowl() {
      initAudio();
      const partials = [216, 598, 1024, 1540];
      const gains = [0.35, 0.18, 0.08, 0.03];
      partials.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gains[idx], audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 6.0);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 6.5);
      });
    }

    function startDrone() {
      if (droneOsc) return;
      initAudio();
      droneOsc = audioCtx.createOscillator();
      droneGain = audioCtx.createGain();
      droneOsc.type = 'triangle';
      droneOsc.frequency.setValueAtTime(108, audioCtx.currentTime);
      droneGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      droneGain.gain.exponentialRampToValueAtTime(0.04, audioCtx.currentTime + 3);
      droneOsc.connect(droneGain);
      droneGain.connect(audioCtx.destination);
      droneOsc.start();
    }

    function stopDrone() {
      if (droneGain) {
        droneGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.5);
        setTimeout(() => {
          if (droneOsc) { droneOsc.stop(); droneOsc = null; }
        }, 1500);
      }
    }

    // Preset Configurations
    const PRESETS = {
      60: [
        { id: 'box', name: 'Phase I: Box Breath', mantra: 'LAM', focus: 'Box Breathing (4-4-4-4)', sub: 'Grounding in Muladhara', duration: 600, color: 'rgba(239, 68, 68, 0.5)' },
        { id: 'mula', name: 'Phase II: Spinal Ascent', mantra: 'LAM', focus: 'Base of Spine — Stability', sub: 'Muladhara Center', duration: 420, color: 'rgba(239, 68, 68, 0.45)' },
        { id: 'svadh', name: 'Phase II: Spinal Ascent', mantra: 'VAM', focus: 'Lower Belly — Fluid Ease', sub: 'Svadhisthana Center', duration: 420, color: 'rgba(249, 115, 22, 0.45)' },
        { id: 'mani', name: 'Phase II: Spinal Ascent', mantra: 'RAM', focus: 'Navel Core — Inner Strength', sub: 'Manipura Center', duration: 420, color: 'rgba(234, 179, 8, 0.45)' },
        { id: 'anah', name: 'Phase II: Spinal Ascent', mantra: 'YAM', focus: 'Heart Center — Spacious Peace', sub: 'Anahata Center', duration: 420, color: 'rgba(34, 197, 94, 0.45)' },
        { id: 'vish', name: 'Phase II: Spinal Ascent', mantra: 'HAM', focus: 'Throat Base — Mental Silence', sub: 'Vishuddha Center', duration: 420, color: 'rgba(59, 130, 246, 0.45)' },
        { id: 'rest', name: 'Phase III: Stillness', mantra: '—', focus: 'Drop Mantras — Rest in Silence', sub: 'Absorb the Energy', duration: 900, color: 'rgba(168, 85, 247, 0.3)' }
      ],
      30: [
        { id: 'box', name: 'Phase I: Box Breath', mantra: 'LAM', focus: 'Box Breathing (4-4-4-4)', sub: 'Grounding in Muladhara', duration: 300, color: 'rgba(239, 68, 68, 0.5)' },
        { id: 'mula', name: 'Phase II: Spinal Ascent', mantra: 'LAM', focus: 'Base of Spine — Stability', sub: 'Muladhara Center', duration: 180, color: 'rgba(239, 68, 68, 0.45)' },
        { id: 'svadh', name: 'Phase II: Spinal Ascent', mantra: 'VAM', focus: 'Lower Belly — Fluid Ease', sub: 'Svadhisthana Center', duration: 180, color: 'rgba(249, 115, 22, 0.45)' },
        { id: 'mani', name: 'Phase II: Spinal Ascent', mantra: 'RAM', focus: 'Navel Core — Inner Strength', sub: 'Manipura Center', duration: 180, color: 'rgba(234, 179, 8, 0.45)' },
        { id: 'anah', name: 'Phase II: Spinal Ascent', mantra: 'YAM', focus: 'Heart Center — Spacious Peace', sub: 'Anahata Center', duration: 180, color: 'rgba(34, 197, 94, 0.45)' },
        { id: 'vish', name: 'Phase II: Spinal Ascent', mantra: 'HAM', focus: 'Throat Base — Mental Silence', sub: 'Vishuddha Center', duration: 180, color: 'rgba(59, 130, 246, 0.45)' },
        { id: 'rest', name: 'Phase III: Stillness', mantra: '—', focus: 'Drop Mantras — Rest in Silence', sub: 'Absorb the Energy', duration: 600, color: 'rgba(168, 85, 247, 0.3)' }
      ],
      15: [
        { id: 'box', name: 'Phase I: Box Breath', mantra: 'LAM', focus: 'Box Breathing (4-4-4-4)', sub: 'Quick Grounding', duration: 180, color: 'rgba(239, 68, 68, 0.5)' },
        { id: 'mula', name: 'Phase II: Spinal Ascent', mantra: 'LAM', focus: 'Base of Spine — Stability', sub: 'Muladhara', duration: 90, color: 'rgba(239, 68, 68, 0.45)' },
        { id: 'svadh', name: 'Phase II: Spinal Ascent', mantra: 'VAM', focus: 'Lower Belly — Fluid Ease', sub: 'Svadhisthana', duration: 90, color: 'rgba(249, 115, 22, 0.45)' },
        { id: 'mani', name: 'Phase II: Spinal Ascent', mantra: 'RAM', focus: 'Navel Core — Inner Strength', sub: 'Manipura', duration: 90, color: 'rgba(234, 179, 8, 0.45)' },
        { id: 'anah', name: 'Phase II: Spinal Ascent', mantra: 'YAM', focus: 'Heart Center — Spacious Peace', sub: 'Anahata', duration: 90, color: 'rgba(34, 197, 94, 0.45)' },
        { id: 'vish', name: 'Phase II: Spinal Ascent', mantra: 'HAM', focus: 'Throat Base — Mental Silence', sub: 'Vishuddha', duration: 90, color: 'rgba(59, 130, 246, 0.45)' },
        { id: 'rest', name: 'Phase III: Stillness', mantra: '—', focus: 'Drop Mantras — Rest in Silence', sub: 'Absorb the Energy', duration: 270, color: 'rgba(168, 85, 247, 0.3)' }
      ],
      2: [
        { id: 'box', name: 'Demo: Box Breath', mantra: 'LAM', focus: 'Box Breathing (4-4-4-4)', sub: 'Testing Box Breath', duration: 24, color: 'rgba(239, 68, 68, 0.5)' },
        { id: 'mula', name: 'Demo: Ascent', mantra: 'LAM', focus: 'Base of Spine — Stability', sub: 'Muladhara', duration: 15, color: 'rgba(239, 68, 68, 0.45)' },
        { id: 'svadh', name: 'Demo: Ascent', mantra: 'VAM', focus: 'Lower Belly — Fluid Ease', sub: 'Svadhisthana', duration: 15, color: 'rgba(249, 115, 22, 0.45)' },
        { id: 'mani', name: 'Demo: Ascent', mantra: 'RAM', focus: 'Navel Core — Inner Strength', sub: 'Manipura', duration: 15, color: 'rgba(234, 179, 8, 0.45)' },
        { id: 'anah', name: 'Demo: Ascent', mantra: 'YAM', focus: 'Heart Center — Spacious Peace', sub: 'Anahata', duration: 15, color: 'rgba(34, 197, 94, 0.45)' },
        { id: 'vish', name: 'Demo: Ascent', mantra: 'HAM', focus: 'Throat Base — Mental Silence', sub: 'Vishuddha', duration: 15, color: 'rgba(59, 130, 246, 0.45)' },
        { id: 'rest', name: 'Demo: Silence', mantra: '—', focus: 'Drop Mantras — Rest in Silence', sub: 'Absorb the Energy', duration: 21, color: 'rgba(168, 85, 247, 0.3)' }
      ]
    };

    let activePresetKey = '60';
    let currentSequence = PRESETS[activePresetKey];
    let isRunning = false;
    let stepIndex = 0;
    let timeInStep = 0;
    let totalSecondsLeft = 3600;
    let intervalTimer = null;
    let boxTimer = null;

    const startBtn = document.getElementById('startBtn');
    const timerEl = document.getElementById('timer');
    const phaseBadge = document.getElementById('phaseBadge');
    const mantraText = document.getElementById('mantraText');
    const focusText = document.getElementById('focusText');
    const subText = document.getElementById('subText');
    const orb = document.getElementById('orb');
    const presetBar = document.getElementById('presetBar');

    function calculateTotalSeconds(seq) {
      return seq.reduce((acc, curr) => acc + curr.duration, 0);
    }

    function selectPreset(key) {
      if (isRunning) pauseSadhana();
      activePresetKey = key;
      currentSequence = PRESETS[key];
      totalSecondsLeft = calculateTotalSeconds(currentSequence);
      stepIndex = 0;
      timeInStep = 0;
      timerEl.textContent = formatTime(totalSecondsLeft);
      phaseBadge.textContent = 'Ready';
      mantraText.textContent = currentSequence[0].mantra;
      focusText.textContent = 'Feet flat, hands resting on thighs';
      subText.textContent = `Selected: ${key === '2' ? '2-min Demo' : key + '-min Sadhana'}`;
      orb.style.background = `radial-gradient(circle, ${currentSequence[0].color} 0%, rgba(0,0,0,0) 70%)`;
      orb.style.transform = 'scale(1)';

      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.preset === key);
      });
    }

    presetBar.addEventListener('click', (e) => {
      const btn = e.target.closest('.preset-btn');
      if (btn) selectPreset(btn.dataset.preset);
    });

    function runBoxBreathingLoop() {
      let phase = 0;
      const phases = ['Inhale (4s)', 'Hold (4s)', 'Exhale (4s)', 'Hold (4s)'];
      boxTimer = setInterval(() => {
        if (!isRunning || currentSequence[stepIndex].id !== 'box') {
          clearInterval(boxTimer);
          return;
        }
        subText.textContent = phases[phase];
        if (phase === 0) {
          orb.style.transform = 'scale(1.4)';
          triggerHaptic([70]);
        } else if (phase === 2) {
          orb.style.transform = 'scale(0.85)';
          triggerHaptic([70]);
        }
        phase = (phase + 1) % 4;
      }, 4000);
    }

    function triggerHaptic(pattern) {
      if (document.getElementById('hapticToggle').checked && 'vibrate' in navigator) {
        navigator.vibrate(pattern);
      }
    }

    function applyStage(step) {
      phaseBadge.textContent = step.name;
      mantraText.textContent = step.mantra;
      focusText.textContent = step.focus;
      subText.textContent = step.sub;
      orb.style.background = `radial-gradient(circle, ${step.color} 0%, rgba(0,0,0,0) 70%)`;
      playSingingBowl();
      triggerHaptic([120, 80, 120]);

      if (step.id === 'box') {
        runBoxBreathingLoop();
      } else {
        clearInterval(boxTimer);
        orb.style.transform = 'scale(1.1)';
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function tick() {
      if (totalSecondsLeft <= 0) {
        completeSadhana();
        return;
      }
      totalSecondsLeft--;
      timeInStep++;
      timerEl.textContent = formatTime(totalSecondsLeft);

      if (timeInStep >= currentSequence[stepIndex].duration) {
        stepIndex++;
        timeInStep = 0;
        if (stepIndex < currentSequence.length) {
          applyStage(currentSequence[stepIndex]);
        }
      }
    }

    function startSadhana() {
      initAudio();
      isRunning = true;
      startBtn.textContent = 'PAUSE';
      if (document.getElementById('droneToggle').checked) startDrone();
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(() => {});
      }
      applyStage(currentSequence[stepIndex]);
      intervalTimer = setInterval(tick, 1000);
    }

    function pauseSadhana() {
      isRunning = false;
      startBtn.textContent = 'RESUME';
      clearInterval(intervalTimer);
      clearInterval(boxTimer);
      stopDrone();
    }

    function completeSadhana() {
      clearInterval(intervalTimer);
      clearInterval(boxTimer);
      stopDrone();
      isRunning = false;
      playSingingBowl();
      phaseBadge.textContent = 'Complete';
      mantraText.textContent = 'OM';
      focusText.textContent = 'Sadhana Integrated';
      subText.textContent = 'Rest in peace and clarity';
      startBtn.textContent = 'BEGIN AGAIN';
      stepIndex = 0;
      totalSecondsLeft = calculateTotalSeconds(currentSequence);
    }

    startBtn.addEventListener('click', () => {
      if (!isRunning) {
        startSadhana();
      } else {
        pauseSadhana();
      }
    });

    // Initialize with 60-minute default
    selectPreset('60');
  </script>
</body>
</html>
